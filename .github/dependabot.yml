# Dependabot: PRs semanais de atualização. Tudo agrupado num PR por ecossistema,
# o que mantém o título curto (o portão de commits aceita até 72 caracteres) e
# passa as atualizações pelo CI de uma vez.
#
# cooldown: só propõe versão publicada há pelo menos 7 dias. Pacote comprometido
# costuma ser descoberto e retirado nos primeiros dias.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Sem "include: scope": o "(deps-dev)" deixava o título com 73 caracteres e o
    # portão de commits (máximo 72) reprovava o PR do próprio Dependabot.
    commit-message:
      prefix: build
    # Os tipos do Node acompanham a versão maior do Node que o projeto roda (24).
    # Subir a versão maior dos tipos é decisão junto com a do Node, não automática.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-seguranca:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
